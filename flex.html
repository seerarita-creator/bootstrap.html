    <title>css document flow</title>
    <style>
        .flexbox{
            display: flex;
            flex-direction:column;
            margin: 5px;
            gap: 15px;
            justify-content: center;
            align-items: center;
            background-color: blueviolet;
            height: 200px;
            width: 100px;
            border-radius: 10px;
            flex-wrap: wrap;
            container: inherit;
            content-visibility: visible;
            contain-intrinsic-block-size: inherit;
            background: fixed;container-type: unset;
            
        
           
            
        }
        .flex_item{
            height: 60px;
            width: 50px;
            border-radius: 10px;
            background-color:greenyellow;
            padding: 15px;
            box-sizing: content-box;
        }
        img{
            height: 250px;
            width: 150px;
            float: left;
            align-content: flex-end;
            background-image: none;
            border-style: groove;
            text-indent: initial;
        }
        body{
            background-color:turquoise;
        }


    </style>
</head>
